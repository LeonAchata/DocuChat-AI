name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docuchat
          POSTGRES_PASSWORD: docuchat
          POSTGRES_DB: docuchat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docuchat" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DOCUCHAT_TEST_DATABASE_URL: postgresql://docuchat:docuchat@localhost:5432/docuchat
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q -rs --junitxml=junit.xml
      - name: Annotate test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("junit.xml").iter("testcase"):
              for f in [*case.iter("failure"), *case.iter("error")]:
                  detail = (f.text or f.get("message") or "")[-3000:]
                  detail = detail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('name')}::{detail}")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
